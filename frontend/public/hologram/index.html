<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ShipMS - 3D Holographic Container Vessel Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Ambient Holographic Glow & Scanline Atmosphere -->
  <div class="holo-ambient-glow"></div>
  <div class="overlay-atmosphere"></div>
  <div class="hologram-scanline-overlay"></div>

  <!-- 3D Hologram Section Callouts & Leader Lines Overlay -->
  <svg id="labels-svg-overlay"></svg>
  <div id="section-labels-container"></div>

  <!-- Corner Sci-Fi Target Decors -->
  <div class="corner-decor corner-tl"></div>
  <div class="corner-decor corner-tr"></div>
  <div class="corner-decor corner-bl"></div>
  <div class="corner-decor corner-br"></div>

  <!-- User Interface Layer -->
  <div class="ui-layer">

    <!-- Top Minimal HUD Header -->
    <header class="top-header">
      <div class="brand-badge">
        <div class="brand-icon"></div>
        <div>
          <div class="brand-title">SHIPMS</div>
          <div class="brand-subtitle">HOLO-MATRIX // CORE v4.8</div>
        </div>
      </div>

      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>VESSEL LINK ACTIVE</span>
      </div>
    </header>

    <!-- Telemetry Badges -->
    <div class="telemetry-left">
      <div>[VESSEL] OCEAN EXPLORER</div>
      <div>[TYPE] ULTRA-LARGE CONTAINER (ULCV)</div>
      <div>[CAPACITY] 24,000 TEU</div>
      <div>[LENGTH] 399.8 M | BEAM: 58.8 M</div>
    </div>

    <div class="telemetry-right">
      <div>[STATUS] HOLOGRAM EMISSION STABLE</div>
      <div>[BEAM] 480nm COHERENT LASER</div>
      <div>[FPS] 60.0 NOMINAL</div>
      <div>[SECURITY] LEVEL-5 ENCRYPTED</div>
    </div>

    <!-- Bottom Action Controls Bar (Matches Reference Image Exactly) -->
    <div class="bottom-controls-container">
      
      <!-- Primary Controls (Rotate, Zoom, Pan, Reset) -->
      <nav class="bottom-toolbar">
        <button id="btn-rotate" class="tool-btn" title="Toggle Auto-Rotation or Drag to Rotate 360°">
          <svg viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>ROTATE</span>
        </button>

        <button id="btn-zoom" class="tool-btn" title="Toggle Zoom In / Out">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
          <span>ZOOM</span>
        </button>

        <button id="btn-pan" class="tool-btn" title="Cycle Focus View (Bow / Bridge / Cargo)">
          <svg viewBox="0 0 24 24">
            <polyline points="5 9 2 12 5 15"/>
            <polyline points="9 5 12 2 15 5"/>
            <polyline points="15 19 12 22 9 19"/>
            <polyline points="19 9 22 12 19 15"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <line x1="12" y1="2" x2="12" y2="22"/>
          </svg>
          <span>PAN</span>
        </button>

        <button id="btn-reset" class="tool-btn" title="Reset Camera to Default 3/4 View">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>RESET</span>
        </button>
      </nav>

      <!-- Secondary Hologram Function Buttons & Volume Slider -->
      <div class="sub-toolbar">
        
        <!-- Hologram Brightness Volume Slider -->
        <div class="brightness-slider-container">
          <div class="brightness-label-group">
            <svg class="brightness-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="brightness-title">HOLOGRAM BRIGHTNESS</span>
          </div>
          <div class="slider-wrapper">
            <input type="range" id="brightness-slider" min="0" max="100" value="40" step="1" title="Adjust Hologram Glow Intensity">
            <span id="brightness-value" class="brightness-val-badge">40%</span>
          </div>
        </div>

        <button id="btn-labels" class="mini-btn active" title="Toggle Hotspots (डॉटेड स्पॉट्स)">HOTSPOTS: ON</button>
        <button id="btn-scan" class="mini-btn">SCAN PULSE</button>
        <button id="btn-wireframe" class="mini-btn">X-RAY WIRE</button>
        <button id="btn-color" class="mini-btn">THEME: CYAN</button>
        <button id="btn-audio" class="mini-btn">AUDIO: OFF</button>
      </div>

    </div>

  </div>

  <!-- Local Offline-Ready Three.js & Post-Processing Libraries -->
  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <script src="lib/CopyShader.js"></script>
  <script src="lib/LuminosityHighPassShader.js"></script>
  <script src="lib/EffectComposer.js"></script>
  <script src="lib/RenderPass.js"></script>
  <script src="lib/ShaderPass.js"></script>
  <script src="lib/UnrealBloomPass.js"></script>

  <!-- Application Modules -->
  <script src="js/hologram-shaders.js"></script>
  <script src="js/ship-builder.js"></script>
  <script src="js/platform-builder.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
